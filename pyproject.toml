[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trackpad-scale-clean-room"
version = "0.1.0"
description = "Clean-room MacBook trackpad ABI and pressure diagnostics"
requires-python = ">=3.9"

[project.scripts]
trackpad-phase1 = "trackpad_scale.phase1_probe:main"
trackpad-phase2 = "trackpad_scale.phase2_probe:main"
trackpad-phase4 = "trackpad_scale.phase4_probe:main"
trackpad-phase4-replay = "trackpad_scale.phase4_replay:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trackpad_scale = ["abi_profiles/*.json", "phase4_profiles/*.json"]
